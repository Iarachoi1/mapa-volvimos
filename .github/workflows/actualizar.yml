name: Actualizar noticias y redes

on:
  schedule:
    # Cada hora (en punto). Las noticias se buscan solo a las 6, 11, 16 y 21 h
    # de Argentina; las redes, todas las horas.
    - cron: "0 * * * *"
  workflow_dispatch:      # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]      # también corre cuando subís cambios a la página

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Bajar los archivos del repositorio
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Buscar noticias (6, 11, 16 y 21 h)
        run: |
          HORA=$(TZ=America/Argentina/Buenos_Aires date +%H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$HORA" = "06" ] || [ "$HORA" = "11" ] || [ "$HORA" = "16" ] || [ "$HORA" = "21" ]; then
            python actualizar_noticias.py
          else
            echo "Son las $HORA h: las noticias se actualizan a las 6, 11, 16 y 21 h."
          fi

      - name: Buscar en redes (cada hora)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python monitor_redes.py || echo "El monitor de redes falló esta vez; la página se publica igual."

      - name: Guardar en el repositorio
        run: |
          git config user.name "actualizador-noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in noticias.json historial.json redes.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -m "Actualización $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git pull --rebase --autostash || true
          git push || echo "No se pudo guardar esta vez; la página se publica igual."

      - name: Preparar la página
        run: |
          mkdir -p _site
          cp index.html noticias.json _site/
          if [ -f redes.json ]; then cp redes.json _site/; fi

      - name: Subir la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
